<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Béla Veltrup — Portfolio</title>
    <script type="text/javascript">
      // GitHub Pages serves only static files, so a direct hit on a route like
      // /impressum has no matching file and lands here. Re-encode the path into
      // a query string and redirect to index.html, which decodes it back into
      // history before React Router mounts. See https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 0
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
